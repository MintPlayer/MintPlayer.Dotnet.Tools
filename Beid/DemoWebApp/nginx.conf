events {}

http {
    server {
        listen 443 ssl;
        server_name eid.mintplayer.com;

        ssl_certificate     /etc/nginx/certs/certificate.pem;
        ssl_certificate_key /etc/nginx/certs/privatekey.pem;

        # TLS 1.2 is PINNED ON PURPOSE — not tech debt. RSA-based eID cards sign
        # the TLS CertificateVerify with PKCS#1 v1.5, which RFC 8446 §4.2.3 forbids
        # in TLS 1.3 (it mandates RSA-PSS, which pre-1.7-applet cards cannot do).
        # TLS 1.2 is the only version in which an RSA eID card can authenticate.
        # See: Beid/DemoWebApp/PRD-tls-version-independence.md
        ssl_protocols       TLSv1.2;

        # The whole reason this nginx exists: control the CertificateRequest
        # signature_algorithms extension. Belgian RSA eID cards cannot sign
        # RSA-PSS, but Go's TLS (Traefik) hardcodes PSS first, so Firefox/NSS
        # picks PSS, the card's PKCS#11 fails, and the handshake hangs. OpenSSL
        # exposes the knob; Go does not. We advertise PKCS#1 v1.5 (RSA+SHA*) for
        # RSA cards AND ECDSA (ECDSA+SHA*) for newer ECC cards (applet >= 1.8,
        # which are ECDSA-only) — but deliberately NO RSA-PSS, so Firefox never
        # tries PSS with an RSA card. The client picks the scheme matching its
        # own key type, so RSA and ECC cards both work under TLS 1.2.
        # See: Beid/DemoWebApp/FIREFOX-MTLS-PSS-ROOTCAUSE.md
        ssl_conf_command SignatureAlgorithms RSA+SHA256:RSA+SHA384:RSA+SHA512:ECDSA+SHA256:ECDSA+SHA384:ECDSA+SHA512;

        # mTLS: request the cert but don't reject when absent — the .NET app
        # decides whether to return 401 based on the endpoint.
        ssl_verify_client       optional_no_ca;
        ssl_client_certificate  /etc/nginx/ca/eid-cas.pem;

        location / {
            proxy_pass         http://eid:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            # Same header name the .NET app already reads. nginx puts the
            # URL-encoded PEM here (vs Traefik's URL-encoded base64 DER) —
            # the HeaderConverter in Program.cs is updated to parse PEM.
            proxy_set_header   X-Forwarded-Tls-Client-Cert $ssl_client_escaped_cert;
        }
    }
}
