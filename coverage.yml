# MintPlayer dependency updates (added by the onboarding pull request). Every line is a default: uncomment to change it.
# dependencies:
#   enabled: true
#   schedule: { frequency: weekly, weekday: monday, hour: 6 }   # in the account's time zone
#   cooldown: 3d                     # third-party releases wait this long; may only lengthen the account's
#   autoMerge:                       # the largest update merged through the merge queue without an approval
#     default: minor
#     "@angular/*": never            # never: every update waits for `approve <group>`
#     maxCoverageDrop: 0.5           # percentage points
#   rules:
#     - match: ["some-package"]
#       ignore: true
#   migrate:                         # approved majors run a migration workflow after the apply
#     - match: "@angular/core"
#       onMajor: angular-migrate.yml
#     - match: "nx"
#       onMajor: nx-migrate.yml

# MintPlayer package versioning (added by the onboarding pull request). The publish workflow tags every release
# `<package id>/v<version>`; the commented lines are the defaults.
versioning:
  mode: server                       # server | local: local runs the engine on the runner, without the app
#   releaseBranches: ["release/*.x"]
#   ignore: ["**/*.md"]              # changed files that never release a package
#   prerelease: upstream             # alpha | beta | next | preview | rc pins the label; upstream mirrors dependencies and the SDK
#   groups:                         # packages that always share one version
#     - name: core
#       packages: [Acme.Core, Acme.Core.*]
#   packages:
#     Acme.Generators: { anchor: free }   # free, or the framework package whose major it follows

# The merge queue. Read from the DEFAULT branch only, so a pull request cannot widen it for itself. Trust settings
# (approval floor, check exclusions) live on the organization/repository pages. Nothing here is generated, so there
# is no regenerate workflow: a conflict in CHANGELOG.md, a csproj or a .json file keeps both sides (keepBothDefaults,
# on by default) and any other conflict evicts the pull request.
mergeQueue:
  enabled: true
  branches: [master]
  mergeMethod: squash
  enqueue:
    label: merge-queue
  postRebaseWhen: never
