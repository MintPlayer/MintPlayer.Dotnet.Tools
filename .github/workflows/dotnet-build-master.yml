name: publish-release

on:
  push:
    branches:
      - 'master'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: publish-release
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      # Full history with tags: MintPlayer.Versioning.MSBuild reads every package version from its <id>/v<version> tag,
      # and a shallow clone has none, so the assemblies were built at 0.0.0.0 (MPV001).
      with:
        fetch-depth: 0

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 11.0.100-rc.1.26425.128

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      # --no-build: `--no-restore` alone does NOT imply it, so without this the
      # solution gets built a second time in Debug and coverage is measured on
      # that build while `dotnet pack` below ships the Release one. Measured:
      # 88s -> 32s, same 679 tests.
      #
      # --collect writes coverage.cobertura.xml into a GUID-named subdirectory
      # of --results-directory, one per test project, hence the ** in the
      # upload glob below.
      run: >
        dotnet test --no-restore --no-build --configuration Release
        --settings coverlet.runsettings
        --collect:"XPlat Code Coverage" --results-directory coverage

    - name: Upload coverage
      # hashFiles guard: a run that produced no report is a no-op rather than an
      # upload of nothing.
      if: always() && hashFiles('coverage/**/coverage.cobertura.xml') != ''
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        url: https://coverage.mintplayer.com
        token: ${{ secrets.COVERAGE_TOKEN }}
        files: |
          coverage/**/coverage.cobertura.xml
        # With search on, a glob that matches nothing silently falls back to
        # auto-detection and would upload stray unparsable reports.
        disable-search: true
        finish: true
        # A coverage-service outage, or a missing COVERAGE_TOKEN, must not fail
        # this workflow before `dotnet pack` and block a NuGet release.
        fail-ci-if-error: false

    - name: Version the packages
      id: versioning
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/versioning-action@1ab0c4002b5506f5f38fd1ab746cce831b113317 # versioning-v1

    # No --no-build: the versions are decided after the tests, so pack builds again to stamp them into the
    # assemblies (--no-build also skips restore, which leaves the nuspec's dependency versions stale).
    - name: Pack
      run: dotnet pack --configuration Release /p:ContinuousIntegrationBuild=true

    # The SourceGenerators releases 10.20.2-12.0.1 and MintPlayer.Assertions 1.0.1-11.0.0-rc.4
    # shipped assemblies versioned 99.9.9.0, because the
    # packaging tests rebuilt bin/Release with their test version before this --no-build pack
    # (#187). Check what is inside the packages before anything is pushed.
    - name: Assert package versions
      shell: pwsh
      run: ./eng/Assert-PackageVersions.ps1 -Path .

    - name: PushNuget
      run: dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.PUBLISH_TO_NUGET_ORG }} --skip-duplicate

    - name: PushGithub
      # Explicit source: GitHub Packages is deliberately NOT a restore source on CI (#200).
      # A restore source answering 403 for a package this repo's token may not read fails the
      # whole restore, even when nuget.org has the package.
      run: dotnet nuget push **/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ github.token }} --no-symbols --skip-duplicate
