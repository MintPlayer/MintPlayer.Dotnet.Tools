name: pull-request

on:
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:

    name: pull-request
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.100
        # Authenticates packages to push to GPR
        source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      env:
        NUGET_AUTH_TOKEN: '%NUGET_AUTH_TOKEN%'

    - name: Install dependencies
      run: dotnet restore
      env:
        NUGET_AUTH_TOKEN: ${{ github.token }}

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      # --collect writes coverage.cobertura.xml into a GUID-named subdirectory
      # of --results-directory, one per test project, hence the ** in the
      # upload glob below.
      run: dotnet test --no-restore --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage

    # Nothing here gates the merge. The service publishes the `coverage/project`
    # and `coverage/patch` check runs itself, and those are what branch
    # protection requires.
    #
    # No `partial:` — unlike ng-bootstrap this runs the whole test suite on
    # every PR, so the upload really is a whole-workspace total.
    - name: Upload coverage
      # Fork PRs get no secrets, so the upload cannot work there. Skip rather
      # than fail — a contributor's PR must not go red over a missing token.
      if: github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      uses: MintPlayer/CodeCoverage/action@master
      with:
        url: https://coverage.mintplayer.com
        token: ${{ secrets.COVERAGE_TOKEN }}
        files: |
          coverage/**/coverage.cobertura.xml
        disable-search: true
        flags: pr
        base-sha: ${{ github.event.pull_request.base.sha }}
        # Closes the build now instead of waiting out the ~2-minute debounce, so
        # the check runs appear while the PR is still being looked at.
        finish: true
        # A coverage-service outage must never be the reason a PR cannot merge.
        fail-ci-if-error: false
