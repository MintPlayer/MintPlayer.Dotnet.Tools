name: dotnet-build-any

on:
  push:
    branches:
      - '**'
      - '!master'
      - '!release/**'

jobs:
  build:

    name: dotnet-build-any
    runs-on: ubuntu-latest

    permissions: 
      contents: read
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      # Full history with tags: MintPlayer.Versioning.MSBuild reads every package version from its <id>/v<version> tag,
      # and a shallow clone has none, so the assemblies were built at 0.0.0.0 (MPV001).
      with:
        fetch-depth: 0
      
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 11.0.100-rc.1.26425.128
    
    - name: Install dependencies
      run: dotnet restore
        
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Test
      # --no-build --configuration Release: `--no-restore` alone does NOT imply --no-build,
      # so this step used to rebuild all 69 projects in Debug and test THAT, while the Build
      # step above produced Release. Visible in the logs as a second full compile, ~74s.
      #
      # No coverage collection here on purpose: master and pull-request already upload, and a
      # feature-branch push would report a third build for the same commit.
      run: dotnet test --no-restore --no-build --configuration Release
    